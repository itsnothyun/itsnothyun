name: daily beat

on:
  schedule:
    - cron: '17 1 * * *'   # 09:17 in Manila (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh activity and banner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/daily.py
      - name: Commit as Hyun
        run: |
          # Authored with the account's no-reply address so the commit counts on the contribution graph.
          git config user.name "Hyun"
          git config user.email "136887029+itsnothyun@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "beat: $(date -u +%Y-%m-%d)"
          git push
